      };

      var params = new URLSearchParams(window.location.search);
      var key = (params.get('post') || params.get('id') || params.get('name') || '').trim().toLowerCase();

      var target = null;
      if (key) {
        if (articleMap[key]) {
          target = articleMap[key];
        } else {
          for (var k in articleMap) {
            if (key.indexOf(k) !== -1 || k.indexOf(key) !== -1) {
              target = articleMap[k];
              break;
            }
          }
        }
      }

      if (!target) {
        target = 'blog.html';
      }

      window.location.replace(target);
    })();
  </script>
