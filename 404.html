        'monitoring': '/monitoring.html',
        'faq': '/faq.html',
        'blog': '/blog.html',
        'reviews': '/airport-reviews.html'
      };

      var pathName = window.location.pathname.toLowerCase();
      var params = new URLSearchParams(window.location.search);
      var queryKey = (params.get('post') || params.get('id') || params.get('name') || '').trim().toLowerCase();

      // 1. 检查是否访问 /article 或携带 post/id query 参数
      if (pathName.indexOf('/article') !== -1 || queryKey) {
        var key = queryKey;
        if (!key) {
          var segments = pathName.split('/').filter(Boolean);
          if (segments.length > 1) {
            key = segments[segments.length - 1].replace('.html', '');
          }
        }

        var target = null;
        if (key && articleMap[key]) {
          target = articleMap[key];
        } else if (key) {
          for (var k in articleMap) {
            if (key.indexOf(k) !== -1 || k.indexOf(key) !== -1) {
              target = articleMap[k];
              break;
            }
          }
        }

        if (target) {
          window.location.replace(target.startsWith('/') ? target : '/' + target);
          return;
        } else if (pathName.indexOf('/article') !== -1) {
          window.location.replace('/blog.html');
          return;
        }
      }

      // 2. 检查未带 .html 的干净路径（如 /tutorials, /downloads, /network-routing-guide）
      var cleanSlug = pathName.replace(/^\//, '').replace(/\/$/, '').replace('.html', '');
      if (cleanSlug && articleMap[cleanSlug]) {
        var cleanTarget = articleMap[cleanSlug];
        window.location.replace(cleanTarget.startsWith('/') ? cleanTarget : '/' + cleanTarget);
        return;
      }
    })();

      您访问的页面链接可能已调整或被更名为全新的静态专栏。我们已为您整理了全站导航入口。
    </p>
