<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="needle-north" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="needle-south" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Compass Ring with Ticks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Cardinal Dial Marks (N, E, S, W ticks) -->
  <line x1="256" y1="78" x2="256" y2="94" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="434" y1="256" x2="418" y2="256" stroke="#ffffff" stroke-dasharray="none" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="434" x2="256" y2="418" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round" />
  <line x1="78" y1="256" x2="94" y2="256" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round" />

  <!-- Ladder Rungs integrated into the Central Compass Structure (梯子 + 指南针) -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round">
    <!-- Left Ladder Rail -->
    <line x1="196" y1="160" x2="196" y2="352" />
    <!-- Right Ladder Rail -->
    <line x1="316" y1="160" x2="316" y2="352" />
    <!-- Ladder Rungs (Steps symbolizing stairs/vpn nodes) -->
    <line x1="196" y1="200" x2="316" y2="200" stroke="#38bdf8" stroke-width="9" />
    <line x1="196" y1="256" x2="316" y2="256" stroke="#ffffff" stroke-width="9" />
    <line x1="196" y1="312" x2="316" y2="312" stroke="#60a5fa" stroke-width="9" />
  </g>

  <!-- Central Dynamic Compass Needle (Pointing North-East Top Right) -->
  <g transform="rotate(35, 256, 256)" filter="url(#glow)">
    <!-- North Pointer (Bright Cyan Gradient) -->
    <polygon points="256,76 284,256 256,236 228,256" fill="url(#needle-north)" />
    <!-- South Pointer -->
    <polygon points="256,436 284,256 256,276 228,256" fill="url(#needle-south)" />
    <!-- Compass Pivot Pin -->
    <circle cx="256" cy="256" r="22" fill="#ffffff" />
    <circle cx="256" cy="256" r="12" fill="#0284c7" />
    <circle cx="256" cy="256" r="5" fill="#ffffff" />
  </g>
</svg>
